name: AI Code Review with xAI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: xAI Code Review
        if: ${{ env.XAI_API_KEY }}
        uses: tarmojussila/xai-code-review@v0.1.1
        with:
          XAI_API_KEY: ${{ env.XAI_API_KEY }}
      - name: Skip when API key is missing
        if: ${{ !env.XAI_API_KEY }}
        run: echo "XAI_API_KEY is not configured; skipping xAI review."
